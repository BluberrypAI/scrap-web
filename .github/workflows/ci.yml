name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 앱 코드(package.json)가 아직 없으면 아래 단계를 건너뛰고 통과함
      - name: Check app code
        id: app
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "package.json 없음: 검사 건너뜀"; fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.app.outputs.exists == 'true'
        run: npm run build --if-present

      - name: Test
        if: steps.app.outputs.exists == 'true'
        run: npm test --if-present
